<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- App Rounded Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#334155" stroke-width="6" />
  
  <!-- Outer Gold Tech Ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="16 8" opacity="0.6" />
  <circle cx="256" cy="256" r="176" fill="url(#glowGrad)" />

  <!-- Gold Bullion / Shield Structure -->
  <g filter="url(#shadow)">
    <!-- Central Shield Emblem -->
    <path d="M256 100 L380 156 L380 276 C380 356 256 424 256 424 C256 424 132 356 132 276 L132 156 Z" 
          fill="url(#goldGrad)" />
    <!-- Inner Dark Core -->
    <path d="M256 124 L356 170 L356 268 C356 332 256 390 256 390 C256 390 156 332 156 268 L156 170 Z" 
          fill="#090d16" />
  </g>

  <!-- Typography XAU in Gold Display -->
  <text x="256" y="246" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="68" 
        font-weight="900" 
        letter-spacing="4"
        fill="url(#goldGrad)" 
        text-anchor="middle">XAU</text>

  <!-- Subtitle AI BOT -->
  <rect x="186" y="270" width="140" height="28" rx="14" fill="#f59e0b" />
  <text x="256" y="290" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="16" 
        font-weight="800" 
        letter-spacing="3"
        fill="#020617" 
        text-anchor="middle">AI SCALPING</text>

  <!-- Dynamic Candlestick Mini Indicator -->
  <g transform="translate(196, 324)">
    <line x1="20" y1="0" x2="20" y2="36" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
    <rect x="14" y="8" width="12" height="20" rx="2" fill="#10b981" />

    <line x1="60" y1="4" x2="60" y2="40" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
    <rect x="54" y="12" width="12" height="18" rx="2" fill="#10b981" />

    <line x1="100" y1="2" x2="100" y2="38" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <rect x="94" y="8" width="12" height="22" rx="2" fill="#fbbf24" />
  </g>
</svg>
